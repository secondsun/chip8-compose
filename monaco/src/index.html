<!DOCTYPE html>

<html>

<head>

    <!--	<meta http-equiv="X-UA-Compatible" content="IE=edge" />-->
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />

    <style type="text/css">
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            overflow-x: hidden;
            overflow-y: hidden;
        }

        #container {
            height: 100%;
        }
    </style>

</head>

<body>
<div id="container"></div>

<script src="package/min/vs/loader.js"></script>

<script>

    var editorCreatedCallback;

    var foldingProvider;
    var editorView;
    var contentChangeListener;
    var scrollChangeListener;

    require.config({ paths: { 'vs': './package/min/vs' } });

    require(['vs/editor/editor.main'], function () {

        monaco.languages.register({ id: "octo" });

        // Register a tokens provider for the language
        monaco.languages.setMonarchTokensProvider("octo", {
            default: 'invalid',
            controls: [
                "return", "if", "then", "begin", "else", "end",
                "loop", "again", "while", "jump", "jump0", ";",
            ],
            statements: [
                "clear", "bcd", "save", "load", "sprite", "hex", "random",
                "delay", "key", "-key", "buzzer", "native", "hires", "lores",
                "scroll-down", "scroll-left", "scroll-right", "bighex",
                "exit", "saveflags", "loadflags", "long", "plane", "audio", "scroll-up", "pitch",
            ],


            directives: [
                ":alias", ":const", ":unpack", ":next", ":org",
                ":byte", ":breakpoint", ":macro", ":calc", ":call", ":monitor",
                ":stringmode", ":assert", ":pointer",
            ],


            // A regular expression for valid string escape sequences
            escapes: /\\(["\\rntv0])/,

            tokenizer: {
                root: [

                    { include: '@whitespace' },

                    [/[+\-]?0x[0-9a-fA-F]+\b/, 'number'],
                    [/[+\-]?0b[01]+\b/, 'number'],
                    [/[+\-]?\d+\b/, 'number'],

                    //registers
                    [/([vV][0-9a-fA-F]|i)\b/, { token: 'register'}],



                    [/:?[\w\-]+/, {
                        cases: {
                            '@directives': { token: 'directive'},
                            '@controls': { token: 'controls'},
                            '@statements': { token: 'statements'},

                        }
                    }],

                    // 6. String Literals
                    [/"/, { token: 'string', bracket: '@open', next: '@string' }],


                    // A standalone colon transitions to the label state to capture the name.
                    [/:\s/, { token: 'label', next: '@label'}],

                    [/(\:=|\+=|\-=|=\-|\|=|&=|\^=|<<=|>>=)/, 'assignment'],



                    [/(==|!=|<=|>=|<|>)/, 'relational'],


                ],
                // State for handling comments and whitespace
                whitespace: [
                    [/[ \t\r\n]+/, ''],
                    [/#.*$/, 'comment'],
                ],


                // State for handling content within a string literal
                string: [
                    [/[^\\"]+/, 'string'],
                    [/@escapes/, 'string'],
                    [/"/, { token: 'string', bracket: '@close', next: '@pop' }]
                ],

                // State for capturing the name of a label after a standalone ":"
                label: [
                    //[/\s+/, ''], // ignore whitespace after the colon
                    [/[^\s]+/, { token: 'label', next: '@pop' }]
                ],


            },
        });


        // Define a new theme that contains only rules that match this language
        monaco.editor.defineTheme("octoTheme", {
            base: "vs",
            inherit: false,
            rules: [
                { token: "comment", foreground: "75715e" },
                { token: "directive", foreground: "9effff" },
                { token: "statements", foreground: "f92672" },
                { token: "controls", foreground: "f92672" },
                { token: "register", foreground: "fd971f" },

                { token: "assignment", foreground: "f92672" },
                { token: "relational", foreground: "f92672" },
                { token: "number", foreground: "ae81ff" },
                { token: "label", foreground: "a6e22e" },
                { token: "string", foreground: "e6db74" }

            ],
            colors: {
                "editor.foreground": "#f8f8f2",
                "editor.background": "#272822",
                "editorLineNumber.foreground": "#d0d0d0",
                "editorLineNumber.activeForeground": "#d0d0d0",
                "editorCursor.foreground": "#d0d0d0",

            },
        });

        editorView = monaco.editor.create(document.getElementById("container"), {
            theme: "octoTheme",
            automaticLayout: true,
            value: getCode(),
            language: "octo",
            minimap: { enabled: false },
            renderLineHighlight: 'none'
        });

    function getCode() {

        return [
            ''
        ].join('\n');

    }


});

    // change the text without losing document history
    function updateText(text) {
        const fullRange = editorView.getModel().getFullModelRange();
        editorView.executeEdits(null, [{
            text: text,
            range: fullRange
        }]);
        editorView.pushUndoStop();
    }

    function getEditorView() {
        return editorView;
    }
</script>

</body>

</html>
